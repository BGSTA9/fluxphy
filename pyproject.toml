[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "fluxphy"
version = "0.1.0"
description = "A file transfer tool with deep instrumentation into the physics of data flux"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Argo Navis Research Laboratory", email = "soheilsanatii@gmail.com"}]
requires-python = ">=3.8"
keywords = ["file-transfer", "cli", "tui", "monitoring", "performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/BGSTA9/fluxphy"
Repository = "https://github.com/BGSTA9/fluxphy"
Documentation = "https://github.com/BGSTA9/fluxphy#readme"
Issues = "https://github.com/BGSTA9/fluxphy/issues"

[project.scripts]
fluxphy = "fluxphy:main"

[tool.maturin]
bindings = "bin"
strip = true
