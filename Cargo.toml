[package]
name = "fluxphy"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A file transfer tool with deep instrumentation into the physics of data flux"
developed_by = ["Argo Navis Research Laboratory"]
license = "MIT"
repository = "https://github.com/BGSTA9/fluxphy"
homepage = "https://github.com/BGSTA9/fluxphy"
keywords = ["file-transfer", "tui", "monitoring", "performance"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2"
fs_extra = "1.3"
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
sha2 = "0.10"
dirs = "5.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.19.0", features = ["v4"] }
whoami = "2.0.2"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "copy_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
