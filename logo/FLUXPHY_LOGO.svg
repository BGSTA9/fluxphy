<svg width="640" height="200" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Scanline pattern for retro effect -->
    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <rect width="100%" height="2" fill="black" fill-opacity="0.3"/>
    </pattern>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- FLUX text with scanlines -->
  <g filter="url(#glow)" font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-size="100" letter-spacing="-2">
    <text x="20" y="115" fill="#7cfc7c">FLUX</text>
  </g>

  <!-- Phi symbol (circle with line) -->
  <g filter="url(#glow)" transform="translate(380, 70)">
    <circle cx="50" cy="0" r="42" stroke="#ffae42" stroke-width="14" fill="none"/>
    <rect x="-5" y="-7" width="110" height="14" fill="#ffae42"/>
  </g>

  <!-- Tagline -->
  <g font-family="Courier New, monospace" font-size="20" filter="url(#glow)">
    <text x="20" y="165" fill="#ffae42">:&gt;</text>
    <text x="60" y="165" fill="#7cfc7c">by Argo Navis Research Laboratory</text>
  </g>

  <!-- Apply scanlines over text -->
  <rect x="20" y="30" width="600" height="90" fill="url(#scanlines)" pointer-events="none"/>
</svg>
